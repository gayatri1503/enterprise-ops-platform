server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    username: ${RABBIT_USER:platform}
    password: ${RABBIT_PASSWORD:change_me}
    connection-timeout: 2s

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-to-32-plus-chars}
  access-ttl-minutes: 15
  refresh-ttl-days: 7

auth:
  cookie-secure: false

events:
  exchange: platform.events

management:
  endpoints:
    web:
      exposure:
        include: health,info