server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    # Defaults let `mvn spring-boot:run` work straight after `docker compose up -d`
    # (postgres is exposed on localhost:5432). Docker Compose overrides these
    # via the `environment:` block when running the whole stack in containers.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  # Same default in auth, core and gateway so local runs work without exporting anything.
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-to-32-plus-chars}
  access-ttl-minutes: 15
  refresh-ttl-days: 7

auth:
  cookie-secure: false   # set true when served over HTTPS

management:
  endpoints:
    web:
      exposure:
        include: health,info