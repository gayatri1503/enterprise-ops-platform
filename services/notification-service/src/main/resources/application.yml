server:
  port: 8085

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/notification_db}
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    username: ${RABBIT_USER:platform}
    password: ${RABBIT_PASSWORD:change_me}
    connection-timeout: 2s
    listener:
      simple:
        default-requeue-rejected: false

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-to-32-plus-chars}

events:
  exchange: platform.events

management:
  endpoints:
    web:
      exposure:
        include: health,info
