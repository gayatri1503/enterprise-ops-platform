server:
  port: 8083

spring:
  application:
    name: core-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/core_db}
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-to-32-plus-chars}

management:
  endpoints:
    web:
      exposure:
        include: health,info